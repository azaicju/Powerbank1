<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안산 폐보조배터리 배출 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef3f1;
  --surface: #ffffff;
  --ink: #0e2924;
  --muted: #4d6862;
  --line: #cfdcd8;
  --brand: #0f6b5c;
  --brand-ink: #ffffff;
  --yes: #0f6b5c;
  --no: #b3261e;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a18; --surface: #162624; --ink: #e8f2ef; --muted: #a3bcb6;
    --line: #2a403c; --brand: #4fc2ac; --brand-ink: #08201b;
    --yes: #4fc2ac; --no: #ff8a80;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a18; --surface: #162624; --ink: #e8f2ef; --muted: #a3bcb6;
  --line: #2a403c; --brand: #4fc2ac; --brand-ink: #08201b;
  --yes: #4fc2ac; --no: #ff8a80;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 1.05rem;
  line-height: 1.6;
  word-break: keep-all;
}
.wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 40px; }

h1 {
  font-size: clamp(1.6rem, 7vw, 2.1rem);
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: -0.02em;
  margin: 0;
}

/* tabs (CSS only) */
.tabs input { position: absolute; opacity: 0; pointer-events: none; }
.tab-bar {
  display: grid; grid-template-columns: 1fr 1fr;
  margin: 18px 0 14px;
  background: var(--surface);
  border: 2px solid var(--brand);
  border-radius: 14px;
  overflow: hidden;
}
.tab-bar label {
  text-align: center; padding: 14px 8px;
  font-weight: 700; font-size: 1.1rem;
  cursor: pointer; color: var(--brand); user-select: none;
}
.tab-bar label + label { border-left: 2px solid var(--brand); }
#t1:checked ~ .tab-bar label[for="t1"],
#t2:checked ~ .tab-bar label[for="t2"] {
  background: var(--brand); color: var(--brand-ink);
}
#t1:focus-visible ~ .tab-bar label[for="t1"],
#t2:focus-visible ~ .tab-bar label[for="t2"] {
  outline: 3px solid var(--ink); outline-offset: -6px;
}
.panel { display: none; }
#t1:checked ~ .panels .p1,
#t2:checked ~ .panels .p2 { display: block; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 6px 18px;
  margin-bottom: 12px;
}
.rules { list-style: none; margin: 0; padding: 0; }
.rules li {
  display: grid; grid-template-columns: 2rem 1fr; gap: 6px;
  padding: 14px 0; border-top: 1px solid var(--line);
  font-weight: 700;
}
.rules li:first-child { border-top: 0; }
.mark { font-weight: 900; font-size: 1.25rem; }
.yes .mark { color: var(--yes); }
.no .mark { color: var(--no); }

.btn {
  display: block; text-align: center; text-decoration: none;
  background: var(--brand); color: var(--brand-ink);
  font-weight: 700; padding: 15px 16px; border-radius: 12px;
}
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.note { margin: 0 0 12px; font-weight: 700; }

.map {
  width: 100%;
  height: min(62vh, 480px);
  min-height: 320px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  display: block;
  margin-bottom: 12px;
}
.place { padding: 14px 0; font-weight: 700; }
.place + .place { border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <h1>안산 폐보조배터리<br>배출 안내</h1>

  <main class="tabs">
    <input type="radio" name="tab" id="t1" checked>
    <input type="radio" name="tab" id="t2">

    <div class="tab-bar">
      <label for="t1">배출 방법</label>
      <label for="t2">수거 장소</label>
    </div>

    <div class="panels">

      <section class="panel p1">
        <div class="card">
          <ul class="rules">
            <li class="yes"><span class="mark">O</span><span>폐건전지 수거함에 넣기</span></li>
            <li class="no"><span class="mark">X</span><span>일반쓰레기·플라스틱에 버리지 않기</span></li>
            <li class="no"><span class="mark">X</span><span>분해하지 않고 그대로 넣기</span></li>
            <li class="yes"><span class="mark">O</span><span>단자가 드러나 있으면 절연하기</span></li>
            <li class="yes"><span class="mark">O</span><span>2차전지 전용 수거함이 있으면 그곳에 넣기</span></li>
          </ul>
        </div>
        <a class="btn" href="https://www.ansan.go.kr/www/common/cntnts/selectContents.do?cntnts_id=C0001357" target="_blank" rel="noopener noreferrer">안산시 공식 배출 안내 보기</a>
      </section>

      <section class="panel p2">
        <p class="note">지도를 움직여 가까운 행정복지센터를 찾아보세요.</p>
        <iframe class="map" title="안산시 행정복지센터 지도" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps?q=%EC%95%88%EC%82%B0%EC%8B%9C+%ED%96%89%EC%A0%95%EB%B3%B5%EC%A7%80%EC%84%BC%ED%84%B0&amp;hl=ko&amp;output=embed"></iframe>
        <a class="btn" href="https://www.google.com/maps/search/?api=1&amp;query=%EC%95%88%EC%82%B0%EC%8B%9C+%ED%96%89%EC%A0%95%EB%B3%B5%EC%A7%80%EC%84%BC%ED%84%B0" target="_blank" rel="noopener noreferrer">큰 지도로 열기</a>
        <div class="card" style="margin-top:12px">
          <div class="place">동 행정복지센터 수거함</div>
          <div class="place">공공주택·학교 내 수거함</div>
        </div>
      </section>

    </div>
  </main>
</div>
</body>
</html>
